<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f7f9fc"/>
  <g font-family="Arial, sans-serif" fill="#18263d">
    <text x="64" y="58" font-size="16" font-weight="700">MINJAE LEE</text>
    <text x="1136" y="58" font-size="14" text-anchor="end" fill="#53657d">APOLLO CLIENT / RECORDED EXPERIMENT</text>
    <line x1="64" y1="82" x2="1136" y2="82" stroke="#d2ddec"/>
    <text x="64" y="163" font-size="58" font-weight="700" letter-spacing="-2">The error disappeared.</text>
    <text x="64" y="229" font-size="58" font-weight="700" letter-spacing="-2" fill="#245dd6">The next query stayed in cache.</text>
    <text x="64" y="275" font-size="21" fill="#53657d">Shown: errorPolicy all, then a cache-first query.</text>
    <g transform="translate(64 320)">
      <rect width="510" height="218" rx="14" fill="#fff" stroke="#cbd8e9"/>
      <text x="26" y="38" font-size="16" fill="#53657d">01 / NETWORK RESPONSE</text>
      <text x="26" y="101" font-family="Consolas, Arial, sans-serif" font-size="29">availability: null</text>
      <text x="26" y="150" font-size="23" font-weight="700">Data + inventory error</text>
      <text x="26" y="187" font-size="17" fill="#53657d">1 HTTP request</text>
    </g>
    <g transform="translate(626 320)">
      <rect width="510" height="218" rx="14" fill="#edf3fb" stroke="#9cb8df"/>
      <text x="26" y="38" font-size="16" fill="#53657d">02 / NEXT CACHE READ</text>
      <text x="26" y="101" font-family="Consolas, Arial, sans-serif" font-size="29">availability: null</text>
      <text x="26" y="150" font-size="23" font-weight="700">Same value. No error.</text>
      <text x="26" y="187" font-size="17" fill="#245dd6">0 HTTP requests</text>
    </g>
    <path d="M586 429h28m-9-8 9 8-9 8" fill="none" stroke="#245dd6" stroke-width="2"/>
    <text x="64" y="592" font-size="15" fill="#53657d">Independent synthetic experiment · Actual Apollo Client, Gateway and HTTP subgraphs</text>
    <text x="1136" y="592" font-size="15" text-anchor="end" fill="#245dd6">minjae-lee-kr.github.io</text>
  </g>
