<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f7f9fc"/>
  <g font-family="Arial, sans-serif" fill="#18263d">
    <text x="64" y="58" font-size="16" font-weight="700">MINJAE LEE</text>
    <text x="1136" y="58" font-size="14" text-anchor="end" fill="#53657d">GIT / RECORDED EXPERIMENT</text>
    <line x1="64" y1="82" x2="1136" y2="82" stroke="#d2ddec"/>
    <text x="64" y="163" font-size="58" font-weight="700" letter-spacing="-2">Roll back the code.</text>
    <text x="64" y="229" font-size="58" font-weight="700" letter-spacing="-2" fill="#245dd6">Reuse the approval?</text>
    <text x="64" y="275" font-size="21" fill="#53657d">Both return to A. What they remember differs.</text>
    <g transform="translate(64 318)">
      <rect width="522" height="220" rx="14" fill="#fff" stroke="#cbd8e9"/>
      <text x="24" y="37" font-size="16" font-weight="700">RESTORE CODE, KEEP THE RECEIPT</text>
      <text x="24" y="112" font-family="Arial, sans-serif" font-size="58" fill="#245dd6">A</text>
      <text x="100" y="93" font-size="22">Approval already recorded</text>
      <text x="100" y="122" font-size="16" fill="#53657d">Same approval, no new transition</text>
      <line x1="24" y1="157" x2="498" y2="157" stroke="#d2ddec"/>
      <text x="24" y="193" font-family="Arial, sans-serif" font-size="18" fill="#245dd6">retry → A</text>
    </g>
    <g transform="translate(614 318)">
      <rect width="522" height="220" rx="14" fill="#edf3fb" stroke="#a6bee0"/>
      <text x="24" y="37" font-size="16" font-weight="700">REWIND THE WHOLE STATE</text>
      <text x="24" y="112" font-family="Arial, sans-serif" font-size="58" fill="#245dd6">A</text>
      <text x="100" y="93" font-size="22">Approval record removed</text>
      <text x="100" y="122" font-size="16" fill="#53657d">Still-fresh approval selects B again</text>
      <line x1="24" y1="157" x2="498" y2="157" stroke="#c4d3e9"/>
      <text x="24" y="193" font-family="Arial, sans-serif" font-size="18" fill="#245dd6">retry → B</text>
    </g>
    <text x="64" y="592" font-size="15" fill="#53657d">Independent synthetic experiment · Actual local Git and process observations</text>
    <text x="1136" y="592" font-size="15" text-anchor="end" fill="#245dd6">minjae-lee-kr.github.io</text>
  </g>
</svg>
